# SERVER-SIDE SHIP GATE — the wall, not the speed bump.
#
# WHY THIS EXISTS
# The local hook (.claude/preship/preship_gate.py) lives in a directory the coding agent
# can write to. It can edit the gate, unregister the hook in .claude/settings.json, or
# hand-write a forged APPROVE marker. It has real value — it blocked a bad commit and
# forced the cold-2nd review that caught four ship-blocking defects — but it is advisory.
#
# This workflow re-derives the verdict on GitHub's runners, where the agent has no write
# access at merge time and, critically, NO ACCESS TO THE API KEYS. It does not read or
# trust any local marker file. It re-runs the external audit itself using repository
# secrets. A forged local marker buys nothing here.
#
# HOW THE RECURSION IS BROKEN (an agent could weaken this file in the same PR):
#   1. Branch protection requires a status check BY NAME: "preship". If this job is
#      renamed or deleted, the required check never reports, and the PR can never merge.
#      Weakening the file cannot unblock the merge — it permanently blocks it.
#   2. .github/CODEOWNERS puts /.github/ under Rafael's review, so any change to this
#      workflow needs his explicit approval before it can merge.
# Neither is something the agent can grant itself. Both are server-side settings.
#
# OPERATOR SETUP (only Rafael can do these — see .github/BRANCH_PROTECTION.md):
#   - Settings > Secrets and variables > Actions: add GEMINI_API_KEY (and GROQ_API_KEY).
#     OPTIONAL: add NVIDIA_API_KEY to enable the option-C free substitute — ci_audit.py uses it
#     ONLY on a Gemini outage (429/5xx) so a Gemini quota/rate outage cannot jam the merge gate.
#   - Settings > Branches > Add rule for `main`: require a PR, require the status check
#     named "preship", require review from Code Owners, and check
#     "Do not allow bypassing the above settings".

name: preship

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]        # catches a direct push if protection is ever off

permissions:
  contents: read

jobs:
  preship:                  # <-- THIS NAME IS PINNED IN BRANCH PROTECTION. Do not rename.
    name: preship
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install static tooling
        run: pip install --quiet ruff mypy

      - name: Determine changed gated files
        id: changed
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
          fi
          # Fall back to the first parent when `before` is unusable (new branch, force push).
          git cat-file -e "$BASE^{commit}" 2>/dev/null || BASE="$(git rev-parse "$HEAD^" 2>/dev/null || echo "$HEAD")"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "head=$HEAD" >> "$GITHUB_OUTPUT"
          git diff --name-only "$BASE" "$HEAD" > /tmp/changed.txt || true
          echo "--- changed files ---"; cat /tmp/changed.txt
          # Gating rule mirrors .claude/preship/preship_gate.py::_is_gated
          python3 - <<'PY' > /tmp/gated.txt
          import os
          # This MUST mirror .claude/preship/preship_gate.py::_is_gated. Drift here is a
          # HOLE: 2026-07-22 (cold-2nd F4) this list omitted .claude/settings.json, so a
          # PR that only unregistered the local hook computed any=false and SKIPPED both
          # the anti-unregistration guard and the external audit below.
          GATED_DIRS = ("execution/","strategy/","events/","data/","indicators/","scripts/")
          GATED_EXTS = (".py",".sh",".json",".yaml",".yml",".ini",".env",".toml",".cfg")
          GATED_SPECIFIC = ("main.py","config.py","requirements.txt","Dockerfile",
                            "Pipfile","CLAUDE.md",".gitignore")
          T7_DIRS = ("reporting/","monitoring/","research/","tests/")
          for line in open("/tmp/changed.txt"):
              p = line.strip()
              if not p:
                  continue
              _, ext = os.path.splitext(p)
              gated = (p in GATED_SPECIFIC
                       or (p.startswith("run_") and p.endswith(".py"))
                       or (p.startswith(GATED_DIRS) and ext in GATED_EXTS)
                       or ("/" not in p and ext in (".py", ".sh"))
                       or p.startswith(".github/")
                       or p.startswith(".claude/preship/")
                       or p == ".claude/settings.json"
                       or (p.startswith(T7_DIRS) and ext in GATED_EXTS))
              if gated:
                  print(p)
          PY
          echo "--- gated files ---"; cat /tmp/gated.txt
          if [ -s /tmp/gated.txt ]; then echo "any=true" >> "$GITHUB_OUTPUT"; else echo "any=false" >> "$GITHUB_OUTPUT"; fi

      - name: Static gate (ruff / mypy / py_compile)
        if: steps.changed.outputs.any == 'true'
        run: |
          set -euo pipefail
          FAIL=0
          while read -r f; do
            [ -f "$f" ] || continue
            case "$f" in
              *.py)
                echo "::group::$f"
                python3 -m py_compile "$f" || FAIL=1
                ruff check --select E,W,F,B "$f" || FAIL=1
                # mypy is advisory in CI: the runner lacks the project's third-party stubs,
                # so import errors here are environmental, not defects. py_compile + ruff
                # are the blocking checks.
                mypy --ignore-missing-imports --warn-unreachable "$f" || true
                echo "::endgroup::"
                ;;
              *.sh) bash -n "$f" || FAIL=1 ;;
            esac
          done < /tmp/gated.txt
          exit $FAIL

      - name: Guard — local gate machinery must not be weakened silently
        if: steps.changed.outputs.any == 'true'
        run: |
          set -euo pipefail
          if grep -qE '^\.claude/preship/|^\.github/' /tmp/gated.txt; then
            echo "::warning::This PR modifies the ship-gate machinery itself."
            echo "CODEOWNERS requires Rafael's review before it can merge."
          fi
          # The local hook must remain registered. Silently unregistering it is the
          # cheapest possible bypass, so make it a hard failure here.
          if [ -f .claude/settings.json ]; then
            python3 - <<'PY'
          import json, sys
          s = json.load(open(".claude/settings.json"))
          hooks = json.dumps(s.get("hooks", {}))
          if "preship_gate.py" not in hooks:
              sys.exit("FAIL: .claude/settings.json no longer registers preship_gate.py "
                       "as a PreToolUse hook — the local gate has been unregistered.")
          print("local gate still registered OK")
          PY
          fi

      - name: External audit of the exact diff (Gemini, server-side key)
        # Runs on BOTH pull_request AND push (2026-07-22, cold-2nd F5). Previously
        # gated on `github.event_name == 'pull_request'`, so a DIRECT push to main —
        # the exact case the `push:` trigger exists to catch when branch protection is
        # off — got static checks only, never the external audit the wall advertises.
        if: steps.changed.outputs.any == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # OPTION-C substitute (2026-08-24): used by ci_audit.py ONLY when Gemini returns an outage
          # code (429/5xx), so a Gemini quota/rate outage cannot fail the wall closed on infra alone.
          # Optional — absent, the audit is unchanged (Gemini-only). It is a server-side secret the
          # agent cannot read, so the "audit the agent cannot fake" property is preserved.
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${GEMINI_API_KEY:-}" ]; then
            echo "::error::GEMINI_API_KEY secret is not set. Add it under"
            echo "Settings > Secrets and variables > Actions, or this gate cannot run."
            exit 1
          fi
          HEAD="${{ steps.changed.outputs.head }}"
          git diff "${{ steps.changed.outputs.base }}" "$HEAD" \
            -- $(tr '\n' ' ' < /tmp/gated.txt) > /tmp/gated.diff
          wc -c /tmp/gated.diff
          # Full post-change content of each changed file, appended after the diff, so the
          # reviewer can resolve a helper/default the diff references but defines outside the
          # shown hunks. This kills the context-starvation false-reject class (2026-07-25:
          # ci_audit rejected `_git("fetch"...)` for "no timeout" when _git defaults timeout=120,
          # a definition the keyhole diff never showed). A deleted file has no HEAD blob → skipped.
          : > /tmp/gated_context.txt
          while read -r f; do
            [ -n "$f" ] || continue
            if git cat-file -e "$HEAD:$f" 2>/dev/null; then
              printf '\n===== FILE: %s =====\n' "$f" >> /tmp/gated_context.txt
              git show "$HEAD:$f" >> /tmp/gated_context.txt
            fi
          done < /tmp/gated.txt
          wc -c /tmp/gated_context.txt
          python3 .github/scripts/ci_audit.py /tmp/gated.diff /tmp/gated_context.txt

      - name: GAI reviewer canary (config-bug tripwire — Gate 4)
        # Anti-inert self-test for the REVIEWER PIPELINE itself (2026-08-25 failure class: a dead
        # model alias `gemini-flash-latest` + a thinking model whose reasoning ate the token budget
        # and emitted no verdict were mistaken for a Gemini OUTAGE for hours, silently routing to
        # the substitute). Runs independently of the diff (if: always). Two layers:
        #   1) the OFFLINE unit test proves the gate's own classification logic is sound (no network),
        #   2) the LIVE canary asserts GAI can return a PARSEABLE verdict right now.
        # It FAILS the wall ONLY on a deterministic CONFIG_BUG (retired pin / thinking-budget) —
        # a transient OUTAGE (all models congested) exits 0 (the substitute covers it), so free-tier
        # congestion can never false-block a merge.
        if: always()
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          python3 .claude/preship/test_gai_health.py
          python3 .claude/preship/gai_health.py canary
